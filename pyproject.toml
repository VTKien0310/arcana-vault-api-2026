[project]
name = "arcana-vault-api-2026"
version = "0.1.0"
description = "Arcana Vault API with FastAPI, Supabase, and PostgreSQL"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.129.0",
    "uvicorn[standard]>=0.30.0",
    "supabase>=2.27.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "alembic>=1.13.0",
    "sqlmodel>=0.0.33",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.11.0",
    "cryptography>=46.0.5",
]

[dependency-groups]
dev = [
    "ruff>=0.15.1",
]
