# fly.toml app configuration file generated for arcana-vault-api-2026 on 2026-02-21T15:42:54+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'arcana-vault-api-2026'
primary_region = 'sin'

[build]

[env]
  ENVIRONMENT = 'production'
  APP_PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
