app = "arcana-vault-api-2026"
primary_region = "sin"

[build]
  [build.args]
    PYTHON_VERSION = "3.14"

[env]
  PORT = "8000"
  ENVIRONMENT = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = '512mb'
  size = 'shared-cpu-1x'
